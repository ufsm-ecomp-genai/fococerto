services:
  fococerto-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fococerto-state:/app/data/estado
      - fococerto-plans:/app/out
      - fococerto-logs:/app/logs
    restart: unless-stopped
volumes:
  fococerto-state:
  fococerto-plans:
  fococerto-logs:
