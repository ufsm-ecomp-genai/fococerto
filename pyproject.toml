[project]
name = "fococerto"
version = "0.1.0"
description = "Priorização e despacho inicial entre incêndios florestais simultâneos (Open Agent Hackathon 2026, Track 3)"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "langgraph==1.2.17",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
