  - {id: dianopolis-t1, base_id: osm_pendente_dianopolis,     tipo: terrestre, capacidade: 1, disponivel: true}
  - {id: mateiros-t1,   base_id: osm_pendente_mateiros,       tipo: terrestre, capacidade: 1, disponivel: true}
