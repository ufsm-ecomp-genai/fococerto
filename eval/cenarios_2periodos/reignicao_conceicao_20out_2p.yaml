situacao_nos_dados: 'Mesmo período real de reignicao_conceicao_20out (20/10), mas sem memória semeada: o sistema roda
  19/10 (P1) com os mesmos recursos, o aprendizado.py compara o plano de P1 com os dados de 20/10 e grava as derivadas,
  e só então roda 20/10 (P2). No cache: cel_-120_-470 tem 6 focos em 17/10, 5 em 18/10, 0 em 19/10 e 14 em 20/10.'
previsao_antes_de_rodar: 'Previsão escrita antes de rodar: o aprendizado.py NÃO deve gerar a memória. Em 19/10 a célula
