    recurso: gurupi-t1
    ocorrencia: cel_-109_-482
- id: c3
  tipo: ocorrencia_atendida_ou_escalada
  categoria: decisao
  descricao: cel_-109_-482 atendida em até 4,5 h ou escalada
  params:
    ocorrencia: cel_-109_-482
    eta_max_h: 4.5
