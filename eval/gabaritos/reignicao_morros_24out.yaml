  17 MW em dois dias e fica no limite do ETA. Sem população em nenhuma das duas, o risco de o fogo grande crescer
  de novo pesa mais, e a equipe chega 4 h antes.
ressalvas: 'Não é uma reignição estrita (não houve dia sem foco). É o caso ''só a memória derivada enxerga'': a
  prioridade do dia não usa o histórico de FRP. Período 24/10 é parcial.'
