escrito_em: '2026-10-24'
autor: time FocoCerto (agente de avaliação), antes de rodar qualquer variante
decisao_certa: morros-t1 vai para cel_-96_-465 (0,7 h), não para cel_-82_-461 (5,0 h).
por_que: Hoje cel_-96_-465 parece pequena (3 focos, 8 MW), mas a memória derivada lembra que em 22/10 ela teve 13
